name: Sync upstream

on:
  schedule:
    - cron: '30 1 * * *' # UTC 01:30 = 北京时间 09:30，每天自动同步原项目
  workflow_dispatch:      # 也支持手动触发（Actions 页面点 Run workflow）

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream (ggzhzc/workbuddy-trae-checkin)
        run: |
          git remote add upstream https://github.com/ggzhzc/workbuddy-trae-checkin.git
          git fetch upstream main

          BEHIND=$(git rev-list --count main..upstream/main)
          echo "落后上游 $BEHIND 个提交"
          if [ "$BEHIND" = "0" ]; then
            echo "上游无更新，结束"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 有冲突时 merge 会失败，任务标红，不会强推
          git merge upstream/main --no-edit

          git push origin main
          echo "已同步 $BEHIND 个上游提交"
